[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudops-inspector"
version = "0.1.0"
description = "Read-only Linux/Docker baseline inspector with HTML reports"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
]

[project.scripts]
cloudops-inspector = "cloudops_inspector.cli:main"

[tool.setuptools.packages.find]
include = ["cloudops_inspector*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
